name: CI

on:
  push:
    branches: ['**']
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check pom version matches tag
        if: github.ref_type == 'tag'
        run: |
          POM_VERSION=$(./mvnw -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "$POM_VERSION" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::pom version $POM_VERSION does not match tag $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Run tests
        run: ./mvnw -B verify

  docker:
    name: Publish image to Docker Hub
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/taskflow-api
          tags: |
            type=sha,enable=${{ github.ref_type == 'branch' }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
